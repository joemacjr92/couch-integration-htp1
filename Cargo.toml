[package]
name = "couch-integration-htp1"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Monoprice HTP-1 integration for CouchOS"
repository = "https://github.com/joemacjr92/couch-integration-htp1"

# Keep this integration independent while consuming the adjacent SDK checkout.
[workspace]

[lib]
name = "couch_integration_htp1"
path = "src/lib.rs"

[[bin]]
name = "couch-plugin-htp1"
path = "src/main.rs"

[dependencies]
# Keep both Couch crates sourced from the adjacent, revision-validated SDK checkout.
couch-plugin = { path = "../couch-sdk-reference/clients/couch-plugin" }
couch-sdk = { path = "../couch-sdk-reference/clients/couch-sdk" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
couch-plugin = { path = "../couch-sdk-reference/clients/couch-plugin", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
